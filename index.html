<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引っ越し・物件選び 資料まとめ</title>
<style>
  :root{
    --bg:#f6f5f2;
    --card:#ffffff;
    --ink:#2b2b28;
    --sub:#6b6b64;
    --line:#e6e3dc;
    --accent:#7a6a53;
    --chip:#efece4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.65;
  }
  header{
    padding:40px 24px 20px;
    max-width:960px;
    margin:0 auto;
  }
  h1{
    font-size:26px;
    margin:0 0 8px;
    letter-spacing:0.02em;
  }
  .sub{
    color:var(--sub);
    font-size:14px;
  }
  main{
    max-width:960px;
    margin:0 auto;
    padding:0 24px 60px;
  }
  section{
    margin-top:32px;
  }
  .section-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 14px;
  }
  .section-title h2{
    font-size:17px;
    margin:0;
    font-weight:600;
  }
  .section-title .count{
    font-size:12px;
    color:var(--sub);
    background:var(--chip);
    border-radius:999px;
    padding:2px 10px;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  a.card{
    display:block;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(43,43,40,0.06);
  }
  .card-title{
    font-size:15px;
    font-weight:600;
    margin:0 0 6px;
  }
  .card-desc{
    font-size:12.5px;
    color:var(--sub);
    margin:0;
  }
  footer{
    max-width:960px;
    margin:20px auto 40px;
    padding:0 24px;
    color:var(--sub);
    font-size:12px;
  }
</style>
</head>
<body>
<header>
  <h1>引っ越し・物件選び 資料まとめ</h1>
  <p class="sub">引っ越し準備と物件選びに関する調査・比較レポートの一覧です。カードをクリックすると各ページを閲覧できます。</p>
</header>
<main>
  <section>
    <div class="section-title">
      <h2>引っ越し業者</h2>
      <span class="count">2件</span>
    </div>
    <div class="cards">
      <a class="card" href="引っ越し業者/引っ越し業者比較レポート_更新版.html">
        <p class="card-title">引っ越し業者 比較レポート（更新版）</p>
        <p class="card-desc">蒲田→押上・9〜11月想定での引っ越し業者比較</p>
      </a>
      <a class="card" href="引っ越し業者/引っ越し事前準備ガイド.html">
        <p class="card-title">引っ越し事前準備ガイド</p>
        <p class="card-desc">2LDK・蒲田→押上の引っ越しに向けた事前準備まとめ</p>
      </a>
    </div>
  </section>

  <section>
    <div class="section-title">
      <h2>物件選び</h2>
      <span class="count">2件</span>
    </div>
    <div class="cards">
      <a class="card" href="物件選び/物件比較レポート.html">
        <p class="card-title">物件比較レポート</p>
        <p class="card-desc">引っ越し先候補の物件比較まとめ</p>
      </a>
      <a class="card" href="物件選び/内見時チェックリスト.html">
        <p class="card-title">内見時チェックリスト</p>
        <p class="card-desc">妊娠・子育てを見据えた住戸選びの詳細レポート</p>
      </a>
    </div>
  </section>
</main>
<footer>
  Last updated: <span id="updated"></span>
</footer>
<script>
  document.getElementById('updated').textContent = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
</script>
</body>
</html>
